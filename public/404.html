<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Nishant Mulane</title>
    <style>
      :root { color-scheme: light dark; --page: #fbfcfd; --ink: #0f1317; --muted: #5b646d; --accent: #3f5f7f; }
      @media (prefers-color-scheme: dark) { :root { --page: #0a0c0f; --ink: #f3f5f7; --muted: #98a2ad; --accent: #a8c0da; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); margin: 0; letter-spacing: -0.06em; }
      p { color: var(--muted); line-height: 1.6; }
      a { display: inline-block; margin-top: 1rem; padding: .75rem 1rem; border-radius: .4rem; background: var(--ink); color: var(--page); text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist or may have moved.</p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
